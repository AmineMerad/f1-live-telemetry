[project]
name = "f1-worker"
version = "0.1.0"
description = "Temporal worker: session + prediction workflows"
requires-python = ">=3.12"
dependencies = ["f1-workflows", "temporalio>=1.9"]

[tool.uv.sources]
f1-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_worker"]
