[project]
name = "f1-live-intelligence"
version = "0.1.0"
description = "F1 live telemetry intelligence — planning/pre-implementation scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "f1-common",
    "f1-features",
    "f1-ingestion",
    "f1-intelligence",
    "f1-prediction",
    "f1-race-state",
    "f1-replay",
    "f1-workflows",
]

[tool.uv.workspace]
members = ["src/*", "services/*"]

[tool.uv.sources]
f1-common = { workspace = true }
f1-features = { workspace = true }
f1-ingestion = { workspace = true }
f1-intelligence = { workspace = true }
f1-prediction = { workspace = true }
f1-race-state = { workspace = true }
f1-replay = { workspace = true }
f1-workflows = { workspace = true }

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_live_intelligence"]
