[project]
name = "f1-workflows"
version = "0.1.0"
description = "Temporal workflows and activities (deterministic boundary)"
requires-python = ">=3.12"
dependencies = ["f1-common", "f1-features", "f1-prediction", "temporalio>=1.9"]

[tool.uv.sources]
f1-common = { workspace = true }
f1-features = { workspace = true }
f1-prediction = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_workflows"]
