[project]
name = "f1-intelligence"
version = "0.1.0"
description = "Pace-change detection and telemetry trace comparison"
requires-python = ">=3.12"
dependencies = [
    "f1-common",
    "matplotlib>=3.11.2",
]

[tool.uv.sources]
f1-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_intelligence"]
