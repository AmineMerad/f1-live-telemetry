[project]
name = "f1-replay"
version = "0.1.0"
description = "Historical replay reader: event-time ordering, no future leak"
requires-python = ">=3.12"
dependencies = ["f1-common"]

[tool.uv.sources]
f1-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_replay"]
