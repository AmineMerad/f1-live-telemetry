[project]
name = "f1-ingestion"
version = "0.1.0"
description = "OpenF1 client and normalization (shared live + replay path)"
requires-python = ">=3.12"
dependencies = ["f1-common", "httpx>=0.27"]

[tool.uv.sources]
f1-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_ingestion"]
