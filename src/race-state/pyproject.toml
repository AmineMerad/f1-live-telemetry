[project]
name = "f1-race-state"
version = "0.1.0"
description = "Race-state reconstruction with freshness and data-quality indicators"
requires-python = ">=3.12"
dependencies = ["f1-common"]

[tool.uv.sources]
f1-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_race_state"]
