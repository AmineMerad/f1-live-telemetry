[project]
name = "f1-prediction"
version = "0.1.0"
description = "Head-to-head baselines, inference, and idempotent prediction writes"
requires-python = ">=3.12"
dependencies = ["f1-common", "f1-features"]

[tool.uv.sources]
f1-common = { workspace = true }
f1-features = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_prediction"]
